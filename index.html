<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- favicon: stüdyonun mavi D-pad ikonu (favicon.png).
         SVG etiketi YOK ve public/favicon.svg SİLİNDİ — o dosya
         `npm create vite` iskeletinden kalan Vite logosuydu (mor şimşek).
         SVG etiketi PNG'den önce durduğu için tarayıcılar onu tercih
         ediyor ve sekmede Vite'ın logosu çıkıyordu. Buraya tekrar bir
         SVG eklemeden önce dosyanın gerçekten Ardeko ikonu olduğunu gör. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Mobil tarayıcı arayüzü site zeminiyle aynı renge boyansın -->
    <meta name="theme-color" content="#05070F" />

    <title>Ardeko Studios — Oyun ve Etkileşimli Medya Stüdyosu</title>
    <meta
      name="description"
      content="İstanbul merkezli bağımsız oyun ve etkileşimli medya stüdyosu. Mobil, web ve masaüstü için fizik tabanlı mekanikler ve minimalist tasarımla oyunlar ve uygulamalar geliştiriyoruz."
    />
    <link rel="canonical" href="https://ardekostudios.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ardeko Studios" />
    <meta property="og:url" content="https://ardekostudios.com/" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Ardeko Studios — Oyun ve Etkileşimli Medya Stüdyosu" />
    <meta
      property="og:description"
      content="İstanbul merkezli bağımsız oyun ve etkileşimli medya stüdyosu. Mobil, web ve masaüstü için oyunlar ve uygulamalar."
    />
    <meta property="og:image" content="https://ardekostudios.com/ardeko.png" />
    <meta property="og:image:alt" content="Ardeko Studios logosu" />

    <!-- logo kare (2490x2490), bu yüzden geniş kart değil 'summary' -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ardeko Studios — Oyun ve Etkileşimli Medya Stüdyosu" />
    <meta
      name="twitter:description"
      content="İstanbul merkezli bağımsız oyun ve etkileşimli medya stüdyosu. Mobil, web ve masaüstü için oyunlar ve uygulamalar."
    />
    <meta name="twitter:image" content="https://ardekostudios.com/ardeko.png" />
  </head>
  <body>
    <!-- Boot ekranı.
         <Preloader> React içinde yaşıyor, yani bundle inip parse edilip tüm
         ağaç render olana kadar kullanıcı bomboş bir sayfaya bakıyor. Bu blok
         HTML'in kendisinde olduğu için ilk boyamada görünür. main.jsx React
         mount olur olmaz siler; oradan sonra <Preloader> devralır. Zemin ve
         wordmark aynı olduğu için geçiş fark edilmez.
         Buraya ağır bir şey ekleme — tüm mesele bunun bedava boyanması. -->
    <div
      id="boot"
      style="
        position: fixed;
        inset: 0;
        z-index: 998;
        background: #05070f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: Inter, system-ui, sans-serif;
      "
    >
      <span
        style="
          font-size: 10px;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 0.5em;
          color: rgba(129, 140, 248, 0.7);
        "
        >Ardeko Studios</span
      >
      <div
        style="
          font-size: clamp(4rem, 16vw, 11rem);
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.05em;
          color: #fff;
          font-variant-numeric: tabular-nums;
        "
      >
        000
      </div>
      <div
        style="
          height: 2px;
          width: min(62vw, 420px);
          overflow: hidden;
          border-radius: 9999px;
          background: rgba(255, 255, 255, 0.1);
        "
      ></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
